# Cloudflare Worker for AI Prompt Genius sync (Feature 2 / Phase E scaffold).
# Deploy:  cd worker && npm i && npx wrangler d1 create aipromptgenius
#          (paste the returned database_id below), then:
#          npx wrangler d1 execute aipromptgenius --file=schema.sql
#          npx wrangler deploy
name = "aipromptgenius-sync"
main = "src/index.ts"
compatibility_date = "2026-07-07"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Dedicated OAuth client/grant storage; local dev uses simulated KV.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "0a64cdd47a814ce1acc9f648d459d99d"

[vars]
MCP_WEEKLY_TOOL_LIMIT = "10000"
MCP_MONTHLY_TOOL_LIMIT = "40000"
MCP_PUBLIC_URL = "https://aipromptgenius-sync.aipromptgenius.workers.dev/mcp"
APP_ORIGIN = "https://lib.aipromptgenius.app"
# WorkOS Client ID (public, not a secret) — from the WorkOS dashboard, per environment.
WORKOS_CLIENT_ID = "client_01KWG8251AYSWRAXXKVHKZGSXN"

[[d1_databases]]
binding = "DB"
database_name = "aipromptgenius"
database_id = "4b6f5963-1c80-4525-934e-11fdcd5fc8f8"

# Rate limiting uses Cloudflare counters, not a D1 write for every request.
[[ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Strongly consistent per-account caps; no D1 usage accounting.
[[durable_objects.bindings]]
name = "MCP_USAGE"
class_name = "McpUsage"

[[migrations]]
tag = "mcp-usage-v1"
new_sqlite_classes = ["McpUsage"]
